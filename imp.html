<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatGPT Course - Dithax Solutions</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  margin: 0;
  background: #f4f6f8;
  color: #111827;
}

/* ===== TOP SECTION ===== */
.top-section {
  display: flex;
  max-width: 1200px;
  margin: 2rem auto;
  gap: 2rem;
  padding: 0 1rem;
  flex-wrap: wrap;
}

.course-image {
  flex: 1 1 40%;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

.course-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.course-details {
  flex: 1 1 50%;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.course-info, .company-card {
  background: #fff;
  padding: 1.5rem;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

.price {
  font-size: 1.4rem;
  font-weight: 700;
  color: #e11d48;
}

.enroll-btn, .enquire-btn {
  background: #154d21;
  color: white;
  border: none;
  padding: 0.6rem 1.2rem;
  border-radius: 6px;
  cursor: pointer;
}

.company-btns {
  display: flex;
  gap: 1rem;
}

/* ===== MODAL ===== */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.modal-content {
  background: white;
  width: 90%;
  max-width: 380px;
  padding: 25px;
  border-radius: 10px;
  position: relative;
}

.close {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 22px;
  cursor: pointer;
}

.modal-content input,
.modal-content select,
.modal-content button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}

.modal-content button {
  background: green;
  color: white;
  border: none;
  cursor: pointer;
}

#msg {
  margin-top: 12px;
  font-weight: bold;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  .top-section {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<!-- ===== COURSE SECTION ===== -->
<div class="top-section">

  <div class="course-image">
    <img src="/courses/chatgpt.jpg" alt="ChatGPT Course">
  </div>

  <div class="course-details">

    <div class="course-info">
      <h2>ChatGPT Course</h2>
      <p class="price">Starts from ₹5,550</p>
      <button class="enroll-btn" onclick="openForm('enroll')">Enroll Now</button>
    </div>

    <div class="company-card">
      <h3>Dithax Solutions</h3>
      <p>dithaxsolutions@gmail.com</p>

      <div class="company-btns">
        <button class="enquire-btn" onclick="openForm('enquire')">Enquire Now</button>
        <button>📞 Call Now</button>
      </div>

      <p>
        Dithax Pvt. Ltd. is a dynamic edtech company committed to bridging the gap
        between academic learning and real-world application.
      </p>
    </div>

  </div>
</div>

<!-- ===== MODAL FORM ===== -->
<div class="modal" id="formModal">
  <div class="modal-content">
    <span class="close" onclick="closeForm()">&times;</span>
    <h2 id="formTitle">Enroll Now</h2>

    <form id="form">
      <input name="name" placeholder="Full Name" required>
      <input name="email" type="email" placeholder="Email Address" required>
      <input name="phone" placeholder="Phone Number" required>

      <select name="course" required>
        <option value="">Select Course</option>
        <option>ChatGPT</option>
        <option>AI</option>
        <option>Data Science</option>
        <option>Web Development</option>
      </select>

      <button type="submit">Submit</button>
    </form>

    <p id="msg"></p>
  </div>
</div>

<script>
let action = "enroll";

function openForm(type) {
  action = type;
  document.getElementById("formTitle").innerText =
    type === "enroll" ? "Enroll Now" : "Enquire Now";
  document.getElementById("formModal").style.display = "flex";
}

function closeForm() {
  document.getElementById("formModal").style.display = "none";
}

const form = document.getElementById("form");
const msg = document.getElementById("msg");

form.addEventListener("submit", function(e) {
  e.preventDefault();
  msg.style.color = "black";
  msg.innerText = "Submitting...";

  fetch(`http://localhost:5000/${action}`, {
    method: "POST",
    body: new FormData(form)
  })
  .then(res => res.json())
  .then(data => {
    msg.style.color = "green";
    msg.innerText = data.message;
    form.reset();
  })
  .catch(() => {
    msg.style.color = "red";
    msg.innerText = "Server error. Try again.";
  });
});

window.onclick = function(e) {
  if (e.target === document.getElementById("formModal")) {
    closeForm();
  }
};
</script>

</body>
</html>
