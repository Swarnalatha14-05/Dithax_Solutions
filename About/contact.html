<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Us</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;}
body{
background:#000;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
display:flex; 
flex-wrap:wrap;
background:#000;
border-radius:12px;
max-width:1100px;
width:100%;
overflow:hidden;
box-shadow:0 0 15px rgba(255,255,255,0.1);
}


.contact-info{
flex:1;
min-width:300px;
padding:30px;
}

.contact-info h2{
font-size:22px;
margin-bottom:10px;
}

.contact-info p{
margin:8px 0;
font-size:15px;
color:#ccc;
}


.map{
margin-top:15px;
border-radius:8px;
overflow:hidden;
position:relative;
}


.map-label{
position:absolute;
top:8px;
left:8px;
background:white;
color:black;
padding:6px 10px;
border-radius:6px;
font-size:14px;
font-weight:bold;
box-shadow:0 2px 6px rgba(0,0,0,0.3);
}


.map-feature{
position:absolute;
top:10px;
right:10px;
background:white;
border-radius:50%;
width:40px;
height:40px;
display:flex;
justify-content:center;
align-items:center;
box-shadow:0 2px 6px rgba(0,0,0,0.3);
cursor:pointer;
}

.map-feature img{
width:22px;
height:22px;
}

.contact-form{
flex:1;
min-width:300px;
background:#fff;
padding:30px;
border-radius:0 12px 12px 0;
color:#000;
}

.contact-form h2{
text-align:center;
margin-bottom:20px;
color:#333;
}

.contact-form label{
display:block;
margin-bottom:6px;
font-weight:bold;
color:#444;
}

.contact-form input,
.contact-form textarea{
width:100%;
padding:10px 12px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

.contact-form textarea{
resize:vertical;
min-height:100px;
}

.contact-form button{
width:100%;
padding:12px;
background:#03194d;
color:#fff;
font-size:16px;
font-weight:bold;
border:none;
border-radius:30px;
cursor:pointer;
transition:0.3s;
}

.contact-form button:hover{
background:#062c7a;
}

.form-message{
text-align:center;
margin-top:15px;
font-weight:bold;
font-size:14px;
}


@media (max-width:992px){
.container{flex-direction:column;}
.contact-form{border-radius:0 0 12px 12px;}
.map iframe{width:100%;height:300px;}
}
</style>
</head>

<body>

<div class="container">


<div class="contact-info">
<h2>Head Office</h2>
<p>📍4th B Cross Rd, KHB Colony, 5th Block, Koramangala, Bengaluru, Karnataka 560095</p>

<h2>Support Enquiries</h2>
<p>
<a href="mailto:dithaxsolutions@gmail.com" style="color:white;text-decoration:none;">
dithaxsolutions@gmail.com
</a>
</p>

<p>
<a href="tel:+91 7539514384" style="color:white;text-decoration:none;">
📞 +91 7539514384
</a>
</p>


<div class="map">


<div class="map-label">Dithax Solutions</div>

<div class="map-feature">
<img src="https://cdn-icons-png.flaticon.com/512/684/684908.png" alt="key feature">
</div>

<iframe
src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3888.5725042583963!2d77.6230329!3d12.9351749!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bae151e0c166b47%3A0x8e451eefe947679f!2sDithax%20solutions!5e0!3m2!1sen!2sin!4v1770016238887!5m2!1sen!2sin"
width="100%" height="250" style="border:0;"
allowfullscreen="" loading="lazy">
</iframe>

</div>
</div>

<div class="contact-form">
<h2>Connect with Us</h2>

<form id="contactForm">
<label>Full Name</label>
<input type="text" id="name" required>

<label>Email Address</label>
<input type="email" id="email" required>

<label>Phone Number</label>
<input type="tel" id="phone" required>

<label>Message</label>
<textarea id="message" required></textarea>

<button type="submit">Submit</button>
</form>

<p id="formMessage" class="form-message"></p>
</div>

</div>

<script>
document.getElementById("contactForm").addEventListener("submit", function(e){
e.preventDefault();

let name = document.getElementById("name").value;
let email = document.getElementById("email").value;
let phone = document.getElementById("phone").value;
let message = document.getElementById("message").value;
let formMessage = document.getElementById("formMessage");

fetch("https://script.google.com/macros/s/AKfycbwKVZ24dMlHu0rjzCc82mZy46KjH_dN_sCrY28J_EGo_Nv4AU7UOMLtsNVhri3UaKis/exec",{
method:"POST",
mode:"no-cors",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({name,email,phone,message})
});

setTimeout(()=>{
formMessage.textContent="✅ Thank you, our team will contact you soon!";
formMessage.style.color="green";
document.getElementById("contactForm").reset();
},500);
});
</script>

</body>
</html>
