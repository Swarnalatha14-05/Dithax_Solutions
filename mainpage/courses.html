        body {

            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }
        
        /* Watermark Styles */
        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            height: 60%;
            background-image: url('https://i.postimg.cc/VNCjKT5p/dithax-logo-removebg-preview.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.05; /* Subtle watermark */
            pointer-events: none;
            z-index: 0;
        }

        .dithax-gradient-text {
            background: linear-gradient(135deg, #ffffff 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .course-card {
            background: rgba(26, 26, 26, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1; /* Ensure cards stay above watermark */
        }
        .course-card:hover {
            border-color: #a855f7;
            transform: scale(1.03);
            box-shadow: 0 15px 30px -10px rgba(168, 85, 247, 0.4);
        }
        .course-image {
            filter: saturate(1.5) contrast(1.1);
        }
        nav, header, footer, main {
            position: relative;
            z-index: 1;
        }

        /* Modal Overlay */
    #form-modal {

        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(8px);
        align-items: center;
        justify-content: center;
    }

    .modal-content {
        width: 420px;
        padding: 35px 30px 40px;
        background: linear-gradient(180deg, #111, #000);
        border-radius: 28px;
        border: 2px solid #ff00cc;
        box-shadow: 0 0 30px rgba(255, 0, 204, 0.35);
        position: relative;
    }

    .close-modal {
        position: absolute;
        top: 20px;
        right: 22px;
        font-size: 26px;
        color: #ff4d4d;
        cursor: pointer;
    }

    .modal-content h2 { margin-bottom: 30px; font-size: 34px; font-weight: 700; color: #fff; }
    .modal-content label { display: block; margin-bottom: 8px; font-size: 18px; font-weight: 600; color: #fff; }
    .modal-content input, .modal-content select {
        width: 100%; padding: 14px 16px; margin-bottom: 22px; border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(255, 255, 255, 0.08);
        color:black; font-size: 15px; outline: none;
    }
    .modal-content input:focus, .modal-content select:focus { border-color: #ff00cc; background: rgba(255, 255, 255, 0.12); }
    
    .submit-btn {
        width: 100%; padding: 16px; border: none; border-radius: 16px;
        background: linear-gradient(90deg, #ff00cc, #a100ff);
        color: #fff; font-size: 20px; font-weight: 700; cursor: pointer;
        transition: all 0.3s;
